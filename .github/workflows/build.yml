name: Build Invoice Processor

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build-macos:
    name: Build macOS (ARM64)
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build executable
      run: |
        pyinstaller --onefile \
          --name "发票提取工具-macOS" \
          --hidden-import=pdfplumber \
          --hidden-import=openpyxl \
          --hidden-import=flask \
          app.py
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: invoice-processor-macos
        path: dist/发票提取工具-macOS
        retention-days: 30

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build executable
      run: |
        pyinstaller --onefile `
          --name "发票提取工具-Windows" `
          --hidden-import=pdfplumber `
          --hidden-import=openpyxl `
          --hidden-import=flask `
          app.py
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: invoice-processor-windows
        path: dist/发票提取工具-Windows.exe
        retention-days: 30

  release:
    name: Create Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download macOS artifact
      uses: actions/download-artifact@v4
      with:
        name: invoice-processor-macos
        path: artifacts/macos
    
    - name: Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: invoice-processor-windows
        path: artifacts/windows
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/macos/发票提取工具-macOS
          artifacts/windows/发票提取工具-Windows.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
